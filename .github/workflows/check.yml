# 代码质量检查工作流
# 职责: lint、type-check、test
#
# 触发条件:
#   1. push 到 master/main/release/** 分支
#   2. 目标为 master/main/release/** 的 Pull Request
#   3. 手动触发 (workflow_dispatch)
#   4. 被其他工作流调用 (workflow_call)
#
# 注意: 不在 tag 时独立触发，tag 发布由 release 工作流调用一次

name: Check

on:
  push:
    branches: [master, main, 'release/**']
  pull_request:
    branches: [master, main, 'release/**']
  # 手动触发
  workflow_dispatch:
  # 允许被其他工作流调用
  workflow_call:

# 同一 PR 的新提交取消旧的检查；分支推送与发布不取消
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint & Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint:check

      - name: Check CSS variables
        run: pnpm run checkCssVars

      - name: Run type check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test:coverage
