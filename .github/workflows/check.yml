# 代码质量检查工作流
# 职责: lint、type-check、test，以及 H5 / 微信 / 支付宝 / App 四端构建
#
# 触发条件:
#   1. push 到 master/main 分支
#   2. Pull Request
#   3. 被其他工作流调用 (workflow_call)
#
# 注意: 不在 tag 时独立触发，由 deploy 工作流调用以避免重复运行

name: Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 手动触发
  workflow_dispatch:
  # 允许被其他工作流调用
  workflow_call:

jobs:
  check:
    name: Lint & Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint:check

      - name: Run type check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [h5, mp-weixin, mp-alipay, app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.platform }}
        run: pnpm build:${{ matrix.platform }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
