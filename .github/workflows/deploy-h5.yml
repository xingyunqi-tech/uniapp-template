# H5 自动部署工作流
# 将 H5 构建产物上传到 uniCloud 前端网页托管 (支付宝云)
#
# 触发条件:
#   1. 推送 tag (v*.*.*)   - 自动部署
#   2. 推送到主分支        - 自动部署
#   3. 手动触发
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加:
#
#   uniCloud 凭证 (在 uniCloud 控制台查看):
#      - UNICLOUD_SPACE_ID: SpaceId (如: env-00jxufipjqj9)
#      - UNICLOUD_AK: AK
#      - UNICLOUD_SK: SK
#
# 获取凭证:
#   1. 登录 https://unicloud.dcloud.net.cn/
#   2. 选择服务空间 -> 查看基本信息
#   3. 复制 SpaceId、AK、SK

name: Deploy H5

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: deploy-h5-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  deploy:
    name: Build & Deploy H5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [[ -z "${{ secrets.UNICLOUD_SPACE_ID }}" ]]; then
            echo "::error::缺少 UNICLOUD_SPACE_ID secret"
            exit 1
          fi
          if [[ -z "${{ secrets.UNICLOUD_AK }}" ]]; then
            echo "::error::缺少 UNICLOUD_AK secret"
            exit 1
          fi
          if [[ -z "${{ secrets.UNICLOUD_SK }}" ]]; then
            echo "::error::缺少 UNICLOUD_SK secret"
            exit 1
          fi
          echo "Secrets 配置正确"

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Build H5
        run: pnpm build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # ==================== 部署到 uniCloud 前端网页托管 ====================
      - name: Deploy to uniCloud
        uses: actions/github-script@v7
        env:
          UNICLOUD_SPACE_ID: ${{ secrets.UNICLOUD_SPACE_ID }}
          UNICLOUD_AK: ${{ secrets.UNICLOUD_AK }}
          UNICLOUD_SK: ${{ secrets.UNICLOUD_SK }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const SPACE_ID = process.env.UNICLOUD_SPACE_ID;
            const AK = process.env.UNICLOUD_AK;
            const SK = process.env.UNICLOUD_SK;
            const DIST_DIR = 'dist/build/h5';

            // uniCloud API 端点
            const API_BASE = 'https://api.bspapp.com';

            // 生成签名
            function generateSign(params, sk) {
              const sortedKeys = Object.keys(params).sort();
              const signStr = sortedKeys.map(k => `${k}=${params[k]}`).join('&');
              return crypto.createHmac('sha256', sk).update(signStr).digest('hex');
            }

            // 获取所有文件
            function getAllFiles(dir, baseDir = dir) {
              const files = [];
              const items = fs.readdirSync(dir);
              for (const item of items) {
                if (item === '.DS_Store' || item === 'Thumbs.db') continue;
                const fullPath = path.join(dir, item);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) {
                  files.push(...getAllFiles(fullPath, baseDir));
                } else {
                  const cloudPath = path.relative(baseDir, fullPath).replace(/\\/g, '/');
                  files.push({ localPath: fullPath, cloudPath, size: stat.size });
                }
              }
              return files;
            }

            // 调用 uniCloud API
            async function callApi(action, params = {}) {
              const timestamp = Date.now();
              const requestParams = {
                spaceId: SPACE_ID,
                accessKey: AK,
                timestamp: timestamp.toString(),
                ...params
              };
              requestParams.sign = generateSign(requestParams, SK);

              const url = `${API_BASE}/hosting/${action}`;
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestParams)
              });

              const data = await response.json();
              if (data.code !== 0 && data.errCode !== 0) {
                throw new Error(`API Error: ${data.message || data.errMsg || JSON.stringify(data)}`);
              }
              return data;
            }

            // 上传单个文件
            async function uploadFile(file) {
              try {
                // 1. 获取上传凭证
                const tokenRes = await callApi('upload-token', {
                  cloudPath: file.cloudPath
                });

                const { uploadUrl, formData, fileId } = tokenRes.data || tokenRes;

                // 2. 上传文件
                const fileContent = fs.readFileSync(file.localPath);
                const form = new FormData();

                if (formData) {
                  Object.entries(formData).forEach(([k, v]) => form.append(k, v));
                }
                form.append('file', new Blob([fileContent]), path.basename(file.localPath));

                const uploadRes = await fetch(uploadUrl, {
                  method: 'POST',
                  body: form
                });

                if (!uploadRes.ok) {
                  throw new Error(`Upload failed: ${uploadRes.statusText}`);
                }

                return true;
              } catch (error) {
                console.log(`Failed to upload ${file.cloudPath}: ${error.message}`);
                return false;
              }
            }

            // 主函数
            async function main() {
              console.log('Scanning files...');
              const files = getAllFiles(DIST_DIR);
              console.log(`Found ${files.length} files`);

              let success = 0;
              let failed = 0;

              for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const result = await uploadFile(file);
                if (result) {
                  success++;
                } else {
                  failed++;
                }

                // 进度
                if ((i + 1) % 10 === 0 || i === files.length - 1) {
                  console.log(`Progress: ${i + 1}/${files.length}`);
                }
              }

              console.log(`\nDeploy complete: ${success} succeeded, ${failed} failed`);

              if (failed > 0) {
                core.setFailed(`${failed} files failed to upload`);
              }
            }

            await main();

      # ==================== 上传构建产物 ====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-build-${{ steps.version.outputs.version }}
          path: dist/build/h5
          retention-days: 7

      - name: Deploy summary
        run: |
          echo "# H5 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SpaceId | ${{ secrets.UNICLOUD_SPACE_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 访问地址" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ secrets.UNICLOUD_SPACE_ID }}.normal.cloudstatic.cn" >> $GITHUB_STEP_SUMMARY
