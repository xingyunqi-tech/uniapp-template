# H5 自动部署工作流
# 构建 H5 版本并通过 SSH + rsync 部署到阿里云服务器
#
# 触发条件:
#   1. 推送 tag (v*.*.*)   - 自动部署
#   2. 手动触发            - 可选择是否部署
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加:
#     - ALIYUN_HOST: 服务器 IP 或域名
#     - ALIYUN_PORT: SSH 端口 (默认 22)
#     - ALIYUN_USER: SSH 用户名
#     - ALIYUN_SSH_KEY: SSH 私钥 (完整内容，包括 BEGIN/END)
#     - ALIYUN_DEPLOY_PATH: 部署目标路径 (如 /var/www/h5)

name: Deploy H5

on:
  push:
    tags:
      - 'v*.*.*'

  # 手动触发
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean

# 并发控制: 同一分支只运行一个部署任务
concurrency:
  group: deploy-h5-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ==================== 代码质量检查 ====================
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  # ==================== 构建任务 ====================
  build:
    name: Build H5
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build H5
        run: pnpm build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check build size
        run: |
          echo "📦 H5 构建产物大小:"
          du -sh dist/build/h5
          echo ""
          echo "📂 目录结构:"
          ls -la dist/build/h5

      # 上传构建产物 (用于下载和部署)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5
          retention-days: 7

  # ==================== 部署到阿里云服务器 ====================
  deploy:
    name: Deploy to Aliyun
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'

    steps:
      - name: Check secrets
        run: |
          if [[ -z "${{ secrets.ALIYUN_HOST }}" ]]; then
            echo "::error::缺少 ALIYUN_HOST secret"
            exit 1
          fi
          if [[ -z "${{ secrets.ALIYUN_USER }}" ]]; then
            echo "::error::缺少 ALIYUN_USER secret"
            exit 1
          fi
          if [[ -z "${{ secrets.ALIYUN_SSH_KEY }}" ]]; then
            echo "::error::缺少 ALIYUN_SSH_KEY secret"
            exit 1
          fi
          if [[ -z "${{ secrets.ALIYUN_DEPLOY_PATH }}" ]]; then
            echo "::error::缺少 ALIYUN_DEPLOY_PATH secret"
            exit 1
          fi
          echo "✅ Secrets 配置正确"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALIYUN_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.ALIYUN_PORT || 22 }} -H ${{ secrets.ALIYUN_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.ALIYUN_PORT || 22 }} -o StrictHostKeyChecking=no" \
            dist/build/h5/ \
            ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:${{ secrets.ALIYUN_DEPLOY_PATH }}/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ H5 部署成功!"
          echo "🖥️ 服务器: ${{ secrets.ALIYUN_HOST }}"
          echo "📁 路径: ${{ secrets.ALIYUN_DEPLOY_PATH }}"

  # ==================== 通知任务 ====================
  notify:
    name: Notify
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "# H5 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🖥️ **服务器**: 阿里云" >> $GITHUB_STEP_SUMMARY
          fi
