# H5 自动部署工作流
# 构建 H5 版本并通过 SSH + rsync 部署到阿里云服务器
#
# 触发条件:
#   1. 推送 tag (v*.*.*)   - 由 release 工作流调用，自动部署
#   2. 手动触发            - 可选择是否部署
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加:
#     - ALIYUN_HOST: 服务器 IP 或域名
#     - ALIYUN_PORT: SSH 端口 (默认 22)
#     - ALIYUN_USER: SSH 用户名
#     - ALIYUN_SSH_KEY: SSH 私钥 (完整内容，包括 BEGIN/END)
#     - ALIYUN_DEPLOY_PATH: 部署目标路径 (如 /var/www/h5)
#     - ALIYUN_KNOWN_HOSTS: 服务器 known_hosts 行 (可选，未配置时用 ssh-keyscan 获取)

name: Deploy H5

on:
  workflow_call:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: false
        default: true
        type: boolean

  # 手动触发
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean

# 并发控制: 固定 group、不中途取消；同组最多一个运行、一个等待，新的等待项会取消旧的等待项
concurrency:
  group: deploy-h5
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: '11'

jobs:
  # ==================== 构建任务 ====================
  build:
    name: Build H5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build H5
        run: pnpm build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check build size
        run: |
          echo "📦 H5 构建产物大小:"
          du -sh dist/build/h5
          echo ""
          echo "📂 目录结构:"
          ls -la dist/build/h5

      # 上传构建产物 (用于下载和部署)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5
          retention-days: 7

  # ==================== 部署到阿里云服务器 ====================
  deploy:
    name: Deploy to Aliyun
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !cancelled() && !failure() && inputs.deploy }}

    steps:
      - name: Check secrets
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
        run: |
          if [[ -z "$ALIYUN_HOST" ]]; then
            echo "::error::缺少 ALIYUN_HOST secret"
            exit 1
          fi
          if [[ -z "$ALIYUN_USER" ]]; then
            echo "::error::缺少 ALIYUN_USER secret"
            exit 1
          fi
          if [[ -z "$ALIYUN_SSH_KEY" ]]; then
            echo "::error::缺少 ALIYUN_SSH_KEY secret"
            exit 1
          fi
          if [[ -z "$ALIYUN_DEPLOY_PATH" ]]; then
            echo "::error::缺少 ALIYUN_DEPLOY_PATH secret"
            exit 1
          fi
          echo "✅ Secrets 配置正确"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT || 22 }}
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts
          else
            echo "::warning::未配置 ALIYUN_KNOWN_HOSTS，主机指纹未固定，本次通过 ssh-keyscan 临时获取；建议配置该 secret"
            # 非 22 端口时 ssh-keyscan 以 [host]:port 格式写入
            if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/deploy_known_hosts || [[ ! -s ~/.ssh/deploy_known_hosts ]]; then
              echo "::error::ssh-keyscan 获取主机公钥失败: $SSH_HOST:$SSH_PORT"
              exit 1
            fi
          fi

      # 先增量上传 assets，再同步 index.html 等其余文件，最后清理过期的旧 assets
      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT || 22 }}
          SSH_USER: ${{ secrets.ALIYUN_USER }}
          DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
          ASSET_RETENTION_DAYS: 7
        run: |
          SSH_CMD="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/deploy_known_hosts"
          REMOTE="$SSH_USER@$SSH_HOST"

          rsync -avz -e "$SSH_CMD" dist/build/h5/assets "$REMOTE:$DEPLOY_PATH/"

          rsync -avz --delete --exclude='/assets/' -e "$SSH_CMD" dist/build/h5/ "$REMOTE:$DEPLOY_PATH/"

          $SSH_CMD "$REMOTE" "find '$DEPLOY_PATH/assets' -type f -mtime +$ASSET_RETENTION_DAYS -print -delete"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts

      - name: Deployment notification
        if: success()
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
        run: |
          echo "✅ H5 部署成功!"
          echo "🖥️ 服务器: $SSH_HOST"
          echo "📁 路径: $DEPLOY_PATH"

  # ==================== 通知任务 ====================
  notify:
    name: Notify
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Summary
        run: |
          echo "# H5 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🖥️ **服务器**: 阿里云" >> $GITHUB_STEP_SUMMARY
          fi
