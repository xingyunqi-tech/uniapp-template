# H5 自动部署工作流
# 构建 H5 版本并部署到 GitHub Pages
#
# 触发条件:
#   1. 推送 tag (v*.*.*)   - 自动部署
#   2. 手动触发            - 可选择是否部署
#
# 配置步骤:
#   1. 在 GitHub 仓库 Settings -> Pages 中:
#      - Source: 选择 "GitHub Actions"
#   2. 如需自定义域名，在 Settings -> Pages -> Custom domain 中配置

name: Deploy H5

on:
  push:
    tags:
      - 'v*.*.*'

  # 手动触发
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到 GitHub Pages'
        required: true
        default: true
        type: boolean

# 并发控制: 同一分支只运行一个部署任务
concurrency:
  group: deploy-h5-${{ github.ref }}
  cancel-in-progress: true

# GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ==================== 代码质量检查 ====================
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  # ==================== 构建任务 ====================
  build:
    name: Build H5
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build H5
        run: pnpm build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check build size
        run: |
          echo "📦 H5 构建产物大小:"
          du -sh dist/build/h5
          echo ""
          echo "📂 目录结构:"
          ls -la dist/build/h5

      # 上传到 GitHub Pages artifact
      - name: Setup Pages
        if: github.event_name == 'push' || github.event.inputs.deploy == 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event.inputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

      # 同时上传普通 artifact (用于下载)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5
          retention-days: 7

  # ==================== 部署到 GitHub Pages ====================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ H5 部署成功!"
          echo "🌐 访问地址: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "如需自定义域名:"
          echo "1. 在仓库 Settings -> Pages -> Custom domain 中配置"
          echo "2. 配置 DNS CNAME 记录指向 <username>.github.io"

  # ==================== 通知任务 ====================
  notify:
    name: Notify
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "# H5 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **访问地址**: 查看 GitHub Pages 设置" >> $GITHUB_STEP_SUMMARY
          fi
