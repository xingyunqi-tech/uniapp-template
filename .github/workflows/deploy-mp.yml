# 小程序自动部署工作流
# 支持微信小程序和支付宝小程序的自动构建与上传
#
# 触发条件:
#   1. 推送 tag (v*.*.*)   - 由 release 工作流调用，自动上传到体验版
#   2. 手动触发            - 可选择平台和操作类型
#
# 注意: 不在 push 分支时触发，避免每次合并都自动部署
#
# 配置步骤:
#   1. 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加以下 secrets:
#      - WEIXIN_APPID: 微信小程序 AppID
#      - WEIXIN_PRIVATE_KEY: 微信小程序上传密钥 (base64 编码)
#      - ALIPAY_APPID: 支付宝小程序 AppID (可选，tag 触发时未配置则跳过支付宝上传)
#      - ALIPAY_PRIVATE_KEY: 支付宝小程序私钥 (可选)
#      - ALIPAY_TOOL_ID: 支付宝小程序工具 ID (可选)
#
# 密钥编码方式 (微信):
#   macOS/Linux: base64 -i private.wx.key | tr -d '\n'
#   Windows: certutil -encode private.wx.key tmp.b64 && type tmp.b64

name: Deploy MiniProgram

on:
  workflow_call:
    inputs:
      platform:
        description: '目标平台 (weixin / alipay / all)'
        required: false
        default: 'weixin'
        type: string
      action:
        description: '操作类型 (upload / preview)'
        required: false
        default: 'upload'
        type: string
      version:
        description: '版本号 (留空则使用 tag 或 package.json 版本)'
        required: false
        default: ''
        type: string
      description:
        description: '版本描述'
        required: false
        default: ''
        type: string
      optional-alipay:
        description: '支付宝 secrets 缺失时跳过支付宝上传，而不是失败'
        required: false
        default: false
        type: boolean

  # 手动触发
  workflow_dispatch:
    inputs:
      platform:
        description: '目标平台'
        required: true
        default: 'weixin'
        type: choice
        options:
          - weixin
          - alipay
          - all
      action:
        description: '操作类型'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - preview
      version:
        description: '版本号 (留空则使用 tag 或 package.json 版本)'
        required: false
        default: ''
        type: string
      description:
        description: '版本描述'
        required: false
        default: ''
        type: string

# 并发控制: 固定 group、不中途取消；同组最多一个运行、一个等待，新的等待项会取消旧的等待项
concurrency:
  group: deploy-mp
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: '11'

jobs:
  # ==================== 构建任务 ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      description: ${{ steps.version.outputs.description }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate inputs
        env:
          PLATFORM: ${{ inputs.platform }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$PLATFORM" in weixin|alipay|all) ;; *) echo "::error::platform 取值无效: $PLATFORM"; exit 1 ;; esac
          case "$ACTION" in upload|preview) ;; *) echo "::error::action 取值无效: $ACTION"; exit 1 ;; esac

      - name: Get version info
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DESC: ${{ inputs.description }}
        run: |
          # 判断触发类型获取版本
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # tag 触发: 从 tag 提取版本号
            VERSION="${GITHUB_REF#refs/tags/v}"
            DESC="Release $VERSION - $(date '+%Y-%m-%d %H:%M')"
          else
            VERSION="$INPUT_VERSION"
            if [[ -z "$VERSION" ]]; then
              VERSION=$(node -p "require('./package.json').version")
            fi
            DESC="$INPUT_DESC"
            if [[ -z "$DESC" ]]; then
              DESC="v$VERSION - $(date '+%Y-%m-%d %H:%M')"
            fi
          fi
          VERSION="${VERSION//$'\n'/ }"
          DESC="${DESC//$'\n'/ }"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "description=$DESC" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
          echo "📝 Description: $DESC"

      # 构建微信小程序
      - name: Build WeChat MiniProgram
        if: inputs.platform == 'weixin' || inputs.platform == 'all'
        run: pnpm build:mp-weixin
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # 构建支付宝小程序
      - name: Build Alipay MiniProgram
        if: inputs.platform == 'alipay' || inputs.platform == 'all'
        run: pnpm build:mp-alipay
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # 检查构建产物大小
      - name: Check build size
        run: |
          echo "📦 检查构建产物大小..."
          echo ""

          # 微信小程序大小限制: 主包 2MB, 总包 20MB
          WEIXIN_MAIN_LIMIT=2097152    # 2MB in bytes
          WEIXIN_TOTAL_LIMIT=20971520  # 20MB in bytes

          # 支付宝小程序大小限制: 主包 2MB, 总包 8MB
          ALIPAY_MAIN_LIMIT=2097152    # 2MB in bytes
          ALIPAY_TOTAL_LIMIT=8388608   # 8MB in bytes

          check_size() {
            local platform=$1
            local path=$2
            local main_limit=$3
            local total_limit=$4

            if [[ -d "$path" ]]; then
              # 计算总大小
              total_size=$(du -sb "$path" | cut -f1)
              total_size_mb=$(echo "scale=2; $total_size / 1048576" | bc)

              echo "📱 $platform 小程序:"
              echo "   总大小: ${total_size_mb}MB"

              # 检查总包大小
              if [[ $total_size -gt $total_limit ]]; then
                total_limit_mb=$(echo "scale=0; $total_limit / 1048576" | bc)
                echo "   ❌ 错误: 总包超出限制 (${total_limit_mb}MB)"
                return 1
              else
                echo "   ✅ 总包大小正常"
              fi

              # 检查主包大小：分包目录 pages-sub 之外的全部内容
              main_size=0
              for item in "$path"/*; do
                if [[ "$(basename "$item")" != "pages-sub" ]]; then
                  item_size=$(du -sb "$item" 2>/dev/null | cut -f1 || echo 0)
                  main_size=$((main_size + item_size))
                fi
              done
              main_size_mb=$(echo "scale=2; $main_size / 1048576" | bc)
              echo "   主包大小: ${main_size_mb}MB"

              if [[ $main_size -gt $main_limit ]]; then
                main_limit_mb=$(echo "scale=0; $main_limit / 1048576" | bc)
                echo "   ❌ 错误: 主包超出限制 (${main_limit_mb}MB)"
                return 1
              else
                echo "   ✅ 主包大小正常"
              fi
              echo ""
            fi
            return 0
          }

          has_error=0

          # 检查微信小程序
          if ! check_size "微信" "dist/build/mp-weixin" $WEIXIN_MAIN_LIMIT $WEIXIN_TOTAL_LIMIT; then
            has_error=1
          fi

          # 检查支付宝小程序
          if ! check_size "支付宝" "dist/build/mp-alipay" $ALIPAY_MAIN_LIMIT $ALIPAY_TOTAL_LIMIT; then
            has_error=1
          fi

          if [[ $has_error -eq 1 ]]; then
            echo "::error::构建产物大小超出限制，请优化代码或使用分包"
            exit 1
          fi

          echo "✅ 所有构建产物大小检查通过"

      # 上传构建产物
      - name: Upload WeChat build artifact
        if: inputs.platform == 'weixin' || inputs.platform == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: mp-weixin-build
          path: dist/build/mp-weixin
          retention-days: 1

      - name: Upload Alipay build artifact
        if: inputs.platform == 'alipay' || inputs.platform == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: mp-alipay-build
          path: dist/build/mp-alipay
          retention-days: 1

  # ==================== 微信小程序上传 ====================
  deploy-weixin:
    name: Deploy WeChat
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{ !cancelled() && !failure() && (
        inputs.platform == 'weixin' ||
        inputs.platform == 'all'
      ) }}

    steps:
      - name: Check secrets
        env:
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_PRIVATE_KEY: ${{ secrets.WEIXIN_PRIVATE_KEY }}
        run: |
          if [[ -z "$WEIXIN_APPID" ]]; then
            echo "::error::缺少 WEIXIN_APPID secret，请在仓库 Settings -> Secrets 中配置"
            exit 1
          fi
          if [[ -z "$WEIXIN_PRIVATE_KEY" ]]; then
            echo "::error::缺少 WEIXIN_PRIVATE_KEY secret，请在仓库 Settings -> Secrets 中配置"
            exit 1
          fi
          echo "✅ 微信小程序 secrets 配置正确"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache miniprogram-ci
        id: mp-ci-cache
        uses: actions/cache@v6
        with:
          path: scripts/mp-ci/node_modules
          key: mp-ci-${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('scripts/mp-ci/package-lock.json') }}

      - name: Install miniprogram-ci
        if: steps.mp-ci-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix scripts/mp-ci --no-audit --no-fund

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: mp-weixin-build
          path: dist/build/mp-weixin

      - name: Upload to WeChat
        env:
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_PRIVATE_KEY: ${{ secrets.WEIXIN_PRIVATE_KEY }}
          MP_VERSION: ${{ needs.build.outputs.version }}
          MP_DESC: ${{ needs.build.outputs.description }}
          MP_ACTION: ${{ inputs.action }}
        run: pnpm tsx scripts/mp-upload.ts weixin "$MP_ACTION"

      - name: Upload preview QR code
        if: always() && inputs.action == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: mp-weixin-preview-qrcode
          path: .temp/preview-qrcode.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload result notification
        if: success()
        env:
          MP_VERSION: ${{ needs.build.outputs.version }}
          MP_DESC: ${{ needs.build.outputs.description }}
        run: |
          echo "✅ 微信小程序上传成功!"
          echo "📦 版本: $MP_VERSION"
          echo "📝 描述: $MP_DESC"
          echo ""
          echo "下一步操作:"
          echo "1. 登录微信小程序后台: https://mp.weixin.qq.com"
          echo "2. 进入「管理」->「版本管理」"
          echo "3. 将体验版提交审核或设置为正式版"

  # ==================== 支付宝小程序上传 ====================
  deploy-alipay:
    name: Deploy Alipay
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{ !cancelled() && !failure() && (
        inputs.platform == 'alipay' ||
        inputs.platform == 'all'
      ) }}

    steps:
      # optional-alipay 为 true 时缺少支付宝 secrets 则跳过后续步骤，否则直接失败
      - name: Check secrets
        id: secrets
        env:
          OPTIONAL_ALIPAY: ${{ inputs.optional-alipay }}
          ALIPAY_APPID: ${{ secrets.ALIPAY_APPID }}
          ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          ALIPAY_TOOL_ID: ${{ secrets.ALIPAY_TOOL_ID }}
        run: |
          missing=()
          [[ -z "$ALIPAY_APPID" ]] && missing+=(ALIPAY_APPID)
          [[ -z "$ALIPAY_PRIVATE_KEY" ]] && missing+=(ALIPAY_PRIVATE_KEY)
          [[ -z "$ALIPAY_TOOL_ID" ]] && missing+=(ALIPAY_TOOL_ID)

          if [[ ${#missing[@]} -gt 0 ]]; then
            if [[ "$OPTIONAL_ALIPAY" == "true" ]]; then
              echo "::notice::未配置支付宝小程序 secrets（${missing[*]}），跳过支付宝上传"
              echo "configured=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::error::缺少支付宝小程序 secrets: ${missing[*]}，请在仓库 Settings -> Secrets 中配置"
            exit 1
          fi
          echo "configured=true" >> $GITHUB_OUTPUT
          echo "✅ 支付宝小程序 secrets 配置正确"

      - name: Checkout code
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: steps.secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v7
        with:
          name: mp-alipay-build
          path: dist/build/mp-alipay

      - name: Upload to Alipay
        if: steps.secrets.outputs.configured == 'true'
        env:
          ALIPAY_APPID: ${{ secrets.ALIPAY_APPID }}
          ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          ALIPAY_TOOL_ID: ${{ secrets.ALIPAY_TOOL_ID }}
          MP_VERSION: ${{ needs.build.outputs.version }}
          MP_DESC: ${{ needs.build.outputs.description }}
          # Node.js 24 使用 OpenSSL 3.x，需要启用 legacy provider 以支持支付宝私钥签名
          NODE_OPTIONS: --openssl-legacy-provider
          MP_ACTION: ${{ inputs.action }}
        run: pnpm tsx scripts/mp-upload.ts alipay "$MP_ACTION"

      - name: Upload result notification
        if: success() && steps.secrets.outputs.configured == 'true'
        env:
          MP_VERSION: ${{ needs.build.outputs.version }}
          MP_DESC: ${{ needs.build.outputs.description }}
        run: |
          echo "✅ 支付宝小程序上传成功!"
          echo "📦 版本: $MP_VERSION"
          echo "📝 描述: $MP_DESC"
          echo ""
          echo "下一步操作:"
          echo "1. 登录支付宝开放平台: https://open.alipay.com"
          echo "2. 进入小程序详情页"
          echo "3. 将体验版提交审核"

  # ==================== 通知任务 ====================
  notify:
    name: Notify
    needs: [build, deploy-weixin, deploy-alipay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Summary
        env:
          MP_VERSION: ${{ needs.build.outputs.version }}
          MP_DESC: ${{ needs.build.outputs.description }}
        run: |
          echo "# 小程序部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | $MP_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| 描述 | $MP_DESC |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 微信 | ${{ needs.deploy-weixin.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 支付宝 | ${{ needs.deploy-alipay.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

      # 可选: 发送通知到钉钉/企业微信/飞书
      # - name: Send notification
      #   if: failure()
      #   run: |
      #     curl -X POST "${{ secrets.WEBHOOK_URL }}" \
      #       -H 'Content-Type: application/json' \
      #       -d '{"msgtype": "text", "text": {"content": "小程序部署失败: ${{ github.repository }}"}}'
